---
layout: default
---

<div class="hero">
    {% if page.logo %}
    <img class="hero__logo" src="{{ page.logo | prepend: '/assets/images/' | prepend: site.baseurl }}" alt="{{ site.title }} logo">
    {% endif %}
    <h1>{{ site.title }}</h1>
    {% if page.description %}
    <p>{{ page.description }}</p>
    {% endif %}
    {% if page.links %}
    <div class="hero-links">
        {% for link in page.links %}
        <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a>
        {% endfor %}
    </div>
    {% endif %}
</div>

{{ content }}
