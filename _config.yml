# Tracker
analytics:

#optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

# Research lines that group the software page (_pages/software.md), in order
software_category:
  legalia:
    title: 'Legal Text Analytics'
    description: "Tools for the automated analysis of legal texts in the Mexican context. The initial focus is the Diario Oficial de la Federación (DOF), Mexico's official gazette, which has published more than 1.2 million legal provisions since 1917."
  compstats:
    title: 'Statistical Comparison of Algorithms'
    description: "A methodology and toolset for statistically comparing the performance of algorithms in scientific and technological competitions, offering off-the-shelf comparisons with correction mechanisms and confidence intervals."
  textclassification:
    title: 'Text Classification'
    description: "Research on text classification, from bag-of-words baselines to dialect identification, together with tools for large-scale text mining."
  similaritysearch:
    title: 'Similarity Search'
    description: "Julia packages for exact and approximate nearest-neighbour search in metric spaces: search graphs, inverted files, sparse text representations and non-linear dimensional reduction with UMAP."

#collection
collections:
  software:
    output: true
    permalink: /software/:path/
# Talks and courses are data files: _data/talks.yml and _data/courses.yml.


sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - README.md
  - LICENSE.md
  - scripts

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-email-protect
  - jekyll-target-blank
