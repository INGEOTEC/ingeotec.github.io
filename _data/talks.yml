    - title: "Ingeotec at DA-VINCIS: Bag-of-Words Classifiers"
      link: https://ingeotec.github.io/talks/IberLEF2023/davincis2023.html
      description: "INGEOTEC's bag-of-words classifiers for detecting violent incidents in social media in the DA-VINCIS task at IberLEF 2023."
